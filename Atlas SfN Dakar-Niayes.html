<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas SfN Dakar–Niayes · GEF 12082</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="atlas.css">
</head>
<body>
<div id="app">
  <aside>
    <div class="brand">
      <div class="k">GEF 12082 · PIMS 10290 · FEM-8 LDCF</div>
      <h1>Atlas des sites SfN — Dakar &amp; Niayes</h1>
    </div>
    <div class="tabs" id="tabs">
      <button data-t="sites" class="on">Sites (15)</button>
      <button data-t="sfn">SfN</button>
      <button data-t="hors">Hors SfN</button>
      <button data-t="niayes">Niayes · eau</button>
      <button data-t="proj">Projections</button>
      <button data-t="meth">Méthode</button>
    </div>

    <div class="pane on" id="p-sites">
      <div id="sitelist"></div>
      <div id="fiche" class="fiche" style="display:none"></div>
    </div>

    <div class="pane" id="p-sfn"></div>
    <div class="pane" id="p-hors"></div>
    <div class="pane" id="p-niayes"></div>
    <div class="pane" id="p-proj"></div>
    <div class="pane" id="p-meth"></div>
  </aside>

  <div id="mapwrap">
    <div id="map"></div>
    <div class="scalebar" id="scalebar"></div>
    <div class="yearbadge" id="yearbadge"></div>
    <div class="basemap" id="basemap">
      <button data-b="sat" class="on">Satellite</button>
      <button data-b="osm">Plan OSM</button>
      <button data-b="topo">Topo</button>
    </div>
    <div class="scaleread" id="scaleread"></div>
    <div class="cursor" id="cursor">—</div>
  </div>
</div>
<div id="print"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="atlas-data.js"></script>
<script src="atlas-verif.js"></script>
<script src="atlas-vuln.js"></script>
<script src="atlas-map.js"></script>
<script src="atlas-sfn.js"></script>
<script src="atlas-sfn-map.js"></script>
<script src="atlas-hors.js"></script>
<script src="atlas-panels.js"></script>
<script src="atlas-pdf.js"></script>
<script src="atlas-3d-hors.js"></script>
<script src="atlas-3d.js"></script>
</body>
</html>
